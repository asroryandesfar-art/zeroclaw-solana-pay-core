[package]
name = "solpay"
description = "Non-custodial Solana Pay CLI: create SOL/USDC invoices, verify chain evidence, and settle atomically in SQLite."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Split library (testable logic) from the thin CLI binary.
[lib]
name = "solpay"
path = "src/lib.rs"

[[bin]]
name = "solpay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
bs58 = "0.5"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
qrcode = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
solana-pubkey = { version = "4.3.0", features = ["curve25519", "sha2"] }
ureq = "2"
url = "2"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "backup"] }
base64 = "0.22"
ring = "0.17"

[features]
# The distributed npm binary pins its issuer at build time. The open-source
# binary remains available under MIT OR Apache-2.0 without an activation gate.
commercial-package = []
# Dependencies are added module-by-module as the implementation lands, so the
# build stays fast and each addition is justified. `money` and `domain` are
# pure std and need nothing.

[dev-dependencies]
serde_json = "1"
